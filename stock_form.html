<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกเบิกแก้วสกรีน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A2E;
    --ink-soft:#5C7075;
    --line:#D8E3E1;
    --glass-1:#EAF3F1;
    --glass-2:#DCEAE7;
    --paper:#FFFFFF;
    --teal:#0E6E62;
    --teal-deep:#0A4F47;
    --amber:#D98E3B;
    --err:#C2483B;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Sarabun', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 0%, #F4FAF8 0%, transparent 45%),
      radial-gradient(circle at 100% 100%, #E4EFEC 0%, transparent 55%),
      linear-gradient(180deg, var(--glass-1) 0%, var(--glass-2) 100%);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:36px 16px;
  }

  .wrap{ width:100%; max-width:420px; }

  /* ---- signature: stacked glass silhouettes as header art ---- */
  .art{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:10px;
    height:64px;
    margin-bottom:14px;
  }
  .art svg{ filter:drop-shadow(0 4px 6px rgba(14,110,98,0.15)); }

  .eyebrow{
    text-align:center;
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal-deep);
    font-weight:600;
    margin-bottom:4px;
  }
  h1{
    font-family:'Kanit', sans-serif;
    font-size:23px;
    font-weight:600;
    text-align:center;
    margin:0 0 26px;
    color:var(--ink);
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 24px 24px;
    box-shadow:0 18px 40px -18px rgba(14,60,53,.28);
  }

  .field{ margin-bottom:18px; position:relative; }
  .field:last-of-type{ margin-bottom:0; }

  label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:7px;
  }
  label .req{ color:var(--amber); font-size:12px; }

  input, select{
    width:100%;
    padding:12px 14px;
    font-size:15.5px;
    font-family:'Sarabun', sans-serif;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#FBFDFD;
    color:var(--ink);
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%235C7075' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:36px;
  }
  select:invalid{ color:#A6B6B4; }
  option{ color:var(--ink); }
  input::placeholder{ color:#A6B6B4; }
  input:focus, select:focus{
    outline:none;
    border-color:var(--teal);
    background-color:#fff;
    box-shadow:0 0 0 3px rgba(14,110,98,0.14);
  }
  input:invalid:not(:placeholder-shown){ border-color:var(--err); }

  .row{ display:flex; gap:12px; }
  .row .field{ flex:1; }

  .note{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  .summary{
    margin-top:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(135deg, #F2F8F6, #E7F2EF);
    border:1px dashed #B9D6CE;
    border-radius:12px;
    padding:12px 14px;
    font-size:13.5px;
  }
  .summary .label{ color:var(--ink-soft); }
  .summary .value{
    font-family:'Kanit', sans-serif;
    font-weight:600;
    font-size:17px;
    color:var(--teal-deep);
  }

  button{
    width:100%;
    margin-top:22px;
    padding:14px;
    font-family:'Kanit', sans-serif;
    font-size:16px;
    font-weight:600;
    letter-spacing:.01em;
    color:#fff;
    background:linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
    border:none;
    border-radius:11px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s;
    box-shadow:0 10px 20px -8px rgba(10,79,71,.55);
  }
  button:hover{ transform:translateY(-1px); box-shadow:0 14px 24px -8px rgba(10,79,71,.6); }
  button:active{ transform:translateY(0); }
  button:disabled{ opacity:.65; cursor:default; transform:none; }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%, 20px);
    background:var(--ink);
    color:#fff;
    padding:12px 20px;
    border-radius:10px;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:8px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.5);
    max-width:90vw;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  .toast.error{ background:var(--err); }

  .footer-link{ text-align:center; margin-top:18px; }
  .footer-link a{
    color:var(--teal-deep);
    font-size:13.5px;
    font-weight:600;
    text-decoration:none;
  }
  .footer-link a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">ระบบตัดสต็อกแก้ว</div>
  <h1>บันทึกเบิกแก้วสกรีน</h1>

  <div class="art">
    <svg width="30" height="46" viewBox="0 0 30 46"><path d="M4 2h22l-3 40a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3L4 2z" fill="#0E6E62" opacity=".25"/><path d="M4 2h22l-3 40a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3L4 2z" fill="none" stroke="#0E6E62" stroke-width="1.6"/></svg>
    <svg width="40" height="58" viewBox="0 0 30 46"><path d="M4 2h22l-3 40a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3L4 2z" fill="#0E6E62" opacity=".35"/><path d="M4 2h22l-3 40a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3L4 2z" fill="none" stroke="#0A4F47" stroke-width="1.8"/><path d="M8 10h14" stroke="#0A4F47" stroke-width="1.2" opacity=".5"/></svg>
    <svg width="30" height="46" viewBox="0 0 30 46"><path d="M4 2h22l-3 40a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3L4 2z" fill="#D98E3B" opacity=".25"/><path d="M4 2h22l-3 40a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3L4 2z" fill="none" stroke="#D98E3B" stroke-width="1.6"/></svg>
  </div>

  <div class="card">
    <form id="stockForm" novalidate>

      <div class="field">
        <label for="customer">ชื่อลูกค้า <span class="req">*</span></label>
        <input type="text" id="customer" required placeholder="เช่น บริษัท ABC จำกัด">
      </div>

      <div class="field">
        <label for="withdrawnBy">ผู้เบิก <span class="req">*</span></label>
        <input type="text" id="withdrawnBy" required placeholder="ชื่อพนักงานผู้เบิก">
      </div>

      <div class="row">
        <div class="field">
          <label for="brand">ยี่ห้อแก้ว <span class="req">*</span></label>
          <select id="brand" required>
            <option value="" disabled selected>เลือกยี่ห้อ</option>
            <option value="FPC">FPC</option>
            <option value="Vanda">Vanda</option>
          </select>
        </div>
        <div class="field">
          <label for="oz">ขนาด (ออนซ์) <span class="req">*</span></label>
          <select id="oz" required>
            <option value="" disabled selected>เลือกขนาด</option>
            <option value="8">8</option>
            <option value="14">14</option>
            <option value="16">16</option>
            <option value="20">20</option>
            <option value="22">22</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="model">รุ่น <span class="req">*</span></label>
        <input type="text" id="model" required placeholder="เช่น รุ่น A, รุ่น B">
      </div>

      <div class="field">
        <label for="boxes">จำนวนที่เบิก (กล่อง) <span class="req">*</span></label>
        <input type="number" id="boxes" min="0.01" step="0.01" required placeholder="เช่น 1, 1.1, 1.05">
        <div class="note">1 กล่อง = 1,000 ใบ · ใส่ทศนิยมได้ เช่น 1.1 = 1,100 ใบ, 1.05 = 1,050 ใบ</div>
      </div>

      <div class="summary">
        <span class="label">รวมจำนวนใบที่เบิก</span>
        <span class="value" id="totalPieces">0 ใบ</span>
      </div>

      <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
    </form>
  </div>

  <div class="footer-link">
    <a href="dashboard.html">ดูแดชบอร์ดสต็อก →</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyi3Ww1OXpC4WrFKQvbPk_gPHbNdc-qWIk787un4UnmZVHQh2p2crCMJt1UFzqXVMpq/exec";

  const boxesInput = document.getElementById('boxes');
  const totalEl = document.getElementById('totalPieces');
  const toast = document.getElementById('toast');
  let toastTimer;

  function updateTotal(){
    const boxes = parseFloat(boxesInput.value);
    const pieces = (boxes > 0) ? Math.round(boxes * 1000) : 0;
    totalEl.textContent = pieces.toLocaleString('th-TH') + ' ใบ';
  }
  boxesInput.addEventListener('input', updateTotal);

  function showToast(message, isError){
    toast.textContent = message;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
  }

  document.getElementById('stockForm').addEventListener('submit', function(e){
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "กำลังบันทึก...";

    const customerVal = document.getElementById('customer').value.trim();
    const withdrawnByVal = document.getElementById('withdrawnBy').value.trim();
    const brandVal = document.getElementById('brand').value.trim();
    const modelVal = document.getElementById('model').value.trim();
    const ozVal = document.getElementById('oz').value.trim();
    const boxesVal = parseFloat(document.getElementById('boxes').value);

    if (!customerVal || !withdrawnByVal || !brandVal || !ozVal || !modelVal || !(boxesVal > 0)) {
      showToast('กรุณากรอกข้อมูลที่จำเป็นให้ครบ (ห้ามเว้นว่างหรือเว้นวรรคล้วน)', true);
      submitBtn.disabled = false;
      submitBtn.innerText = "บันทึกข้อมูล";
      return;
    }

    const payload = {
      type: 'out',
      customer: customerVal,
      withdrawnBy: withdrawnByVal,
      brand: brandVal,
      model: modelVal,
      oz: ozVal,
      boxes: boxesVal,
      pieces: Math.round(boxesVal * 1000)
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      showToast('บันทึกข้อมูลสำเร็จ');
      document.getElementById('stockForm').reset();
      updateTotal();
      submitBtn.disabled = false;
      submitBtn.innerText = "บันทึกข้อมูล";
    })
    .catch(error => {
      showToast('เกิดข้อผิดพลาด: ' + error, true);
      submitBtn.disabled = false;
      submitBtn.innerText = "บันทึกข้อมูล";
    });
  });
</script>

</body>
</html>
