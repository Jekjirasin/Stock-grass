<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกรับแก้วเข้าสต็อก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A2E;
    --ink-soft:#5C7075;
    --line:#D8E3E1;
    --glass-1:#EAF3F1;
    --glass-2:#DCEAE7;
    --paper:#FFFFFF;
    --teal:#0E6E62;
    --teal-deep:#0A4F47;
    --amber:#D98E3B;
    --err:#C2483B;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Sarabun', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 0%, #FBF7F0 0%, transparent 45%),
      radial-gradient(circle at 100% 100%, #F3EADA 0%, transparent 55%),
      linear-gradient(180deg, var(--glass-1) 0%, var(--glass-2) 100%);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:36px 16px;
  }

  .wrap{ width:100%; max-width:420px; }

  .art{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:10px;
    height:64px;
    margin-bottom:14px;
  }
  .art svg{ filter:drop-shadow(0 4px 6px rgba(217,142,59,0.18)); }

  .eyebrow{
    text-align:center;
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:600;
    margin-bottom:4px;
  }
  h1{
    font-family:'Kanit', sans-serif;
    font-size:23px;
    font-weight:600;
    text-align:center;
    margin:0 0 26px;
    color:var(--ink);
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 24px 24px;
    box-shadow:0 18px 40px -18px rgba(60,45,14,.22);
  }

  .field{ margin-bottom:18px; }
  .field:last-of-type{ margin-bottom:0; }

  label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:7px;
  }
  label .req{ color:var(--amber); font-size:12px; }
  label .opt{ color:var(--ink-soft); font-weight:400; font-size:12px; }

  input, select{
    width:100%;
    padding:12px 14px;
    font-size:15.5px;
    font-family:'Sarabun', sans-serif;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#FBFDFD;
    color:var(--ink);
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%235C7075' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:36px;
  }
  option{ color:var(--ink); }
  input::placeholder, textarea::placeholder{ color:#A6B6B4; }
  input:focus, select:focus{
    outline:none;
    border-color:var(--amber);
    background-color:#fff;
    box-shadow:0 0 0 3px rgba(217,142,59,0.16);
  }

  .row{ display:flex; gap:12px; }
  .row .field{ flex:1; }

  .note{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  .summary{
    margin-top:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(135deg, #FBF3E7, #F5E8D3);
    border:1px dashed #E2C68F;
    border-radius:12px;
    padding:12px 14px;
    font-size:13.5px;
  }
  .summary .label{ color:var(--ink-soft); }
  .summary .value{
    font-family:'Kanit', sans-serif;
    font-weight:600;
    font-size:17px;
    color:#9C5F16;
  }

  button{
    width:100%;
    margin-top:22px;
    padding:14px;
    font-family:'Kanit', sans-serif;
    font-size:16px;
    font-weight:600;
    letter-spacing:.01em;
    color:#fff;
    background:linear-gradient(135deg, var(--amber) 0%, #B06E22 100%);
    border:none;
    border-radius:11px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s;
    box-shadow:0 10px 20px -8px rgba(176,110,34,.5);
  }
  button:hover{ transform:translateY(-1px); box-shadow:0 14px 24px -8px rgba(176,110,34,.55); }
  button:active{ transform:translateY(0); }
  button:disabled{ opacity:.65; cursor:default; transform:none; }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%, 20px);
    background:var(--ink);
    color:#fff;
    padding:12px 20px;
    border-radius:10px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.5);
    max-width:90vw;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  .toast.error{ background:var(--err); }

  .footer-link{ text-align:center; margin-top:18px; }
  .footer-link a{
    color:#9C5F16;
    font-size:13.5px;
    font-weight:600;
    text-decoration:none;
    margin:0 8px;
  }
  .footer-link a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">ระบบตัดสต็อกแก้ว</div>
  <h1>บันทึกรับแก้วเข้าสต็อก</h1>

  <div class="art">
    <svg width="30" height="46" viewBox="0 0 30 46"><path d="M4 2h22l-3 40a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3L4 2z" fill="#D98E3B" opacity=".22"/><path d="M4 2h22l-3 40a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3L4 2z" fill="none" stroke="#D98E3B" stroke-width="1.6"/></svg>
    <svg width="42" height="30" viewBox="0 0 42 30"><path d="M4 20 L21 4 L38 20" fill="none" stroke="#B06E22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 26 L21 10 L38 26" fill="none" stroke="#D98E3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/></svg>
    <svg width="30" height="46" viewBox="0 0 30 46"><path d="M4 2h22l-3 40a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3L4 2z" fill="#0E6E62" opacity=".18"/><path d="M4 2h22l-3 40a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3L4 2z" fill="none" stroke="#0E6E62" stroke-width="1.6"/></svg>
  </div>

  <div class="card">
    <form id="stockInForm" novalidate>

      <div class="row">
        <div class="field">
          <label for="brand">ยี่ห้อแก้ว <span class="req">*</span></label>
          <select id="brand" required>
            <option value="" disabled selected>เลือกยี่ห้อ</option>
            <option value="FPC">FPC</option>
            <option value="Vanda">Vanda</option>
          </select>
        </div>
        <div class="field">
          <label for="oz">ขนาด (ออนซ์) <span class="req">*</span></label>
          <select id="oz" required>
            <option value="" disabled selected>เลือกขนาด</option>
            <option value="8">8</option>
            <option value="14">14</option>
            <option value="16">16</option>
            <option value="20">20</option>
            <option value="22">22</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="model">รุ่น <span class="req">*</span></label>
        <input type="text" id="model" required placeholder="เช่น รุ่น A, รุ่น B">
      </div>

      <div class="field">
        <label for="boxes">จำนวนที่รับเข้า (กล่อง) <span class="req">*</span></label>
        <input type="number" id="boxes" min="0.01" step="0.01" required placeholder="เช่น 10, 5.5">
        <div class="note">1 กล่อง = 1,000 ใบ · ใส่ทศนิยมได้</div>
      </div>

      <div class="field">
        <label for="note">หมายเหตุ <span class="opt">(ไม่บังคับ)</span></label>
        <input type="text" id="note" placeholder="เช่น เลขที่ใบส่งของ, ผู้จัดส่ง">
      </div>

      <div class="summary">
        <span class="label">รวมจำนวนใบที่รับเข้า</span>
        <span class="value" id="totalPieces">0 ใบ</span>
      </div>

      <button type="submit" id="submitBtn">บันทึกรับเข้า</button>
    </form>
  </div>

  <div class="footer-link">
    <a href="stock_form.html">← ฟอร์มเบิก</a>
    <a href="dashboard.html">แดชบอร์ดสต็อก →</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMxCqD22PTSY4Z0Ulpt8mZgqiVNqjoD11Lasinf1wTQAm-rdV21-xcRl31vL82h3dx/exec";

  const boxesInput = document.getElementById('boxes');
  const totalEl = document.getElementById('totalPieces');
  const toast = document.getElementById('toast');
  let toastTimer;

  function updateTotal(){
    const boxes = parseFloat(boxesInput.value);
    const pieces = (boxes > 0) ? Math.round(boxes * 1000) : 0;
    totalEl.textContent = pieces.toLocaleString('th-TH') + ' ใบ';
  }
  boxesInput.addEventListener('input', updateTotal);

  function showToast(message, isError){
    toast.textContent = message;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
  }

  document.getElementById('stockInForm').addEventListener('submit', function(e){
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "กำลังบันทึก...";

    const boxesVal = parseFloat(document.getElementById('boxes').value);
    const payload = {
      type: 'in',
      brand: document.getElementById('brand').value,
      model: document.getElementById('model').value,
      oz: document.getElementById('oz').value,
      boxes: boxesVal,
      pieces: Math.round(boxesVal * 1000),
      note: document.getElementById('note').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      showToast('บันทึกรับเข้าสำเร็จ');
      document.getElementById('stockInForm').reset();
      updateTotal();
      submitBtn.disabled = false;
      submitBtn.innerText = "บันทึกรับเข้า";
    })
    .catch(error => {
      showToast('เกิดข้อผิดพลาด: ' + error, true);
      submitBtn.disabled = false;
      submitBtn.innerText = "บันทึกรับเข้า";
    });
  });
</script>

</body>
</html>
